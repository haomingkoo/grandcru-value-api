name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check for plaintext secrets
        run: python scripts/check_no_plaintext_secrets.py

      - name: Validate deploy commands
        run: python scripts/check_deploy_commands.py

      - name: Compile pipeline scripts
        run: |
          python -m py_compile \
            scripts/refresh_pipeline.py \
            scripts/llm_grandcru_resolver.py \
            scripts/diagnose_grandcru_matches.py \
            scripts/check_deploy_commands.py \
            scripts/check_no_plaintext_secrets.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest
